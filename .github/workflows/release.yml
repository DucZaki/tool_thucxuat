name: Build & Release

# Moi lan push len main:
#   - doc __version__ trong thuc_xuat/version.py
#   - neu tag v<version> chua co Release -> build .exe, tao Release + file zip
#   - neu da co -> bo qua (nen chi can tang version khi muon phat hanh ban moi)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Doc phien ban
        id: ver
        shell: pwsh
        run: |
          $text = Get-Content thuc_xuat/version.py -Raw
          if ($text -match '__version__\s*=\s*"([^"]+)"') {
            "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
            Write-Host "Phien ban: $($Matches[1])"
          } else {
            throw "Khong tim thay __version__ trong thuc_xuat/version.py"
          }

      - name: Kiem tra Release da ton tai
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag da co — bo qua build."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Se tao Release $tag."
          }

      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Cai thu vien
        if: steps.check.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r build-requirements.txt

      - name: Chay test
        if: steps.check.outputs.exists == 'false'
        run: python -m unittest discover -s tests

      - name: Build exe
        if: steps.check.outputs.exists == 'false'
        run: python -m PyInstaller --noconfirm --clean ThucXuatTool.spec

      - name: Dong goi zip
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          $out = "dist\ThucXuatTool"
          Copy-Item config.json.example "$out\config.json.example"
          Copy-Item HUONG-DAN-NGUOI-DUNG.txt "$out\"
          Copy-Item Chay-ThucXuatTool.bat "$out\"
          Compress-Archive -Path $out -DestinationPath "dist\ThucXuatTool-win64.zip" -Force
          Get-Item "dist\ThucXuatTool-win64.zip" | Select-Object Name, Length

      - name: Build bo cai mot cham
        if: steps.check.outputs.exists == 'false'
        run: python build_installer.py --no-app

      - name: Tao Release
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release create $tag "dist\ThucXuatTool-win64.zip" "dist\ThucXuatTool-Setup.exe" `
            --repo $env:GITHUB_REPOSITORY `
            --title "Thuc Xuat Tool $tag" `
            --generate-notes
